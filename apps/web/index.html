<!doctype html>
<html lang="en-GB">
  <head>

    <title>careerRepo — CV builder, job tracker &amp; interview practice</title>
    <meta
      name="description"
      content="Build tailored CVs and cover letters, track every job application, check your CV against job descriptions and practise interviews. Free to start."

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f8ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070c18" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="careerRepo" />
    <meta property="og:title" content="careerRepo — CV builder, job tracker & interview practice" />

      property="og:description"

    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="careerRepo — CV builder, job tracker & interview practice" />
    <meta
      name="twitter:description"
      content="Tailored CVs and cover letters, a job application tracker, CV-to-job match scores and interview practice in one place."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preload" href="/fonts/inter-latin-v20.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Applies the dark theme before first paint (external because the CSP blocks inline scripts). -->
