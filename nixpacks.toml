# Railway "web" service (railway.json): builds the SPA, serves it with server.js.
# The VITE_* variables must be set on the service; the build fails without them.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
# pnpm pinned to package.json "packageManager" (npx avoids writing global
# shims into the read-only Nix store). NODE_ENV=development so the build
# tooling (vite, a devDependency) is installed.
cmds = ["NODE_ENV=development npx --yes pnpm@9.15.0 install --frozen-lockfile"]

[phases.build]
cmds = ["npx --yes pnpm@9.15.0 --filter @careerportal/web build"]

[start]
cmd = "node server.js"
